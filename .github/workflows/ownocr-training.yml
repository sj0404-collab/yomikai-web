name: обучение своего OCR (детсад → университет)

# Зачем на раннере: обучение — это счёт, ему нужны ядра, а не браузер.
# Раннер GitHub даёт 4 ядра и 16 ГБ, поэтому курс из 8 уровней с проверкой
# домашних заданий и «повторением до звонка» укладывается в 40 минут.
on:
  workflow_dispatch:
    inputs:
      budget:
        description: 'бюджет обучения, минут'
        default: '38'
      stages:
        description: 'какие уровни (пусто = все)'
        default: ''
  push:
    paths:
      - 'ownocr/ownocr/**'
      - 'ownocr/scripts/**'
      - '.github/workflows/ownocr-training.yml'

concurrency:
  group: ownocr-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      BUDGET: ${{ github.event.inputs.budget || '38' }}
      STAGES: ${{ github.event.inputs.stages || '' }}
      FONTS_DIR: /home/runner/fonts
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 'зависимости — лёгкие, без torch и без onnx'
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet numpy opencv-python-headless pillow
          python -c "import numpy, cv2, PIL; print('numpy', numpy.__version__, 'cv2', cv2.__version__)"

      - name: 'шрифты из кэша'
        id: fonts
        uses: actions/cache@v4
        with:
          path: /home/runner/fonts
          key: cyr-fonts-300-v1

      - name: 'скачать 296 кириллических шрифтов'
        if: steps.fonts.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$FONTS_DIR"
          python ownocr/scripts/01_fetch_fonts.py --limit 300 --out "$FONTS_DIR" --layout /tmp/ownocr
          ls "$FONTS_DIR" | wc -l

      - name: 'нарисовать лист'
        run: |
          python ownocr/scripts/02_make_sheet.py --fonts "$FONTS_DIR" --px 30 --out ownocr/out
          ls -l ownocr/out/sheet.png

      - name: 'взять прошлую зачётную ступень из ветки ownocr-model'
        run: |
          git fetch origin ownocr-model --depth 1 2>/dev/null || true
          mkdir -p ownocr/model
          if git cat-file -e origin/ownocr-model:ownocr-latest.npz 2>/dev/null; then
            git show origin/ownocr-model:ownocr-latest.npz > ownocr/model/ownocr-latest.npz
            git show origin/ownocr-model:ownocr-latest.npz.json > ownocr/model/ownocr-latest.npz.json 2>/dev/null || true
            git show origin/ownocr-model:diploma.json > ownocr/model/diploma.json 2>/dev/null || true
            echo "продолжаем с прошлой модели: $(ls -l ownocr/model/ownocr-latest.npz | awk '{print $5}') Б"
          else
            echo "прошлой модели нет — начинаем с чистого листа"
          fi

      - name: 'курс обучения'
        run: |
          cd ownocr
          python scripts/06_curriculum.py --budget-minutes "$BUDGET" --out model --resume \
            ${STAGES:+--stages "$STAGES"} 2>&1 | tee out/curriculum-console.txt

      - name: 'урок 7 — настоящая страница, с приёмкой'
        run: |
          cd ownocr
          python scripts/04_lesson_real.py --epochs 18 2>&1 | tee out/lesson-real-console.txt
          python - <<'PY'
          import json, os, shutil
          r = json.load(open('out/lesson-real.json', encoding='utf-8'))
          print('приёмка:', r['accepted'], '· CER', round(100 * r['before_cer'], 1), '→',
                round(100 * r['after_cer'], 1), '%')
          if r['accepted']:
              shutil.copy('out/ownocr-real/ownocr.npz', 'model/ownocr-latest.npz')
              print('правки приняты и встали в модель')
          else:
              print('правки не приняты — модель осталась зачётной')
          PY

      - name: 'итоговая проверка'
        run: |
          cd ownocr
          python scripts/05_metrics.py --model model --out out/metrics-final.json 2>&1 | tee out/metrics-console.txt

      - name: 'артефакты'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ownocr-model
          path: |
            ownocr/model
            ownocr/out/curriculum-log.txt
            ownocr/out/diploma-final.json
            ownocr/out/metrics-final.json
            ownocr/out/metrics-console.txt
            ownocr/out/curriculum-console.txt
            ownocr/out/lesson-real.json
            ownocr/out/lesson-real-console.txt
          retention-days: 30

      - name: 'зафиксировать в ветке ownocr-model'
        if: always()
        run: |
          mkdir -p /tmp/bank
          cp -a ownocr/model/. /tmp/bank/ 2>/dev/null || true
          cp ownocr/out/curriculum-log.txt /tmp/bank/ 2>/dev/null || true
          cp ownocr/out/metrics-final.json /tmp/bank/ 2>/dev/null || true
          cd /tmp/bank
          printf '%s\n' \
            "Зачётная книжка своего OCR (обновляется обучением на раннере)." \
            "" \
            "Модель: ownocr-latest.npz · диплом: diploma.json · журнал: curriculum-log.txt" \
            "Запуск: ${GITHUB_RUN_ID} · коммит: ${GITHUB_SHA}" > README.md
          git init -q -b ownocr-model
          git config user.email "actions@github.com"
          git config user.name "ownocr-training"
          git add -A
          git commit -q -m "ownocr: курс ${GITHUB_RUN_ID}" || true
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ownocr-model
