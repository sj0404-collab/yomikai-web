name: проверки

# Гоняется на каждый push: тесты страницы (node), самопроверка инструментов,
# контракт модели, если модель лежит в репозитории.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Зависимости
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core
          python3 -m pip install -q -r tools/requirements.txt
      # Без playwright e2e-проверки Lens молча «пропускаются», и красный прогон
      # выглядит зелёным. На ранере он ставится за минуту — ставим всегда.
      - name: Браузер для e2e
        run: |
          python3 -m pip install -q playwright
          python3 -m playwright install --with-deps chromium
      - name: Тесты страницы
        run: bash run_all.sh
      - name: Движок Lens виден в читалке
        run: python3 lab/lens_ui_check.py --shot shots/lens-in-reader.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lens-ui
          path: |
            shots/lens-in-reader.png
            shots/lens-direct.png
            shots/models-sheet.png
          if-no-files-found: warn
      - name: Самопроверка инструментов
        run: python3 tools/selftest.py
      - name: Контракт распознавателя (если модель в репозитории)
        run: |
          for m in models/*.onnx koma_models/*.onnx; do
            [ -f "$m" ] || continue
            case "$(basename "$m")" in
              koma_det*|*detection*) echo "== $m — детектор, контракт распознавателя к нему не относится"; continue;;
            esac
            echo "== $m"; python3 tools/check_onnx_contract.py "$m" || exit 1
          done
