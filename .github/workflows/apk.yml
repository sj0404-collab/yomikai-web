name: сборка АПК

# Зачем: АПК-обёртка собирается здесь, на ранере, потому что в песочнице нет
# Android SDK.
#
# Важное про обновления (28.10): релиз в репозитории ОДИН — тег `page`. Файлы в
# нём (koma-web.html, version.json, APK) перезаписываются каждой сборкой, а не
# плодятся новые релизы. Приложение читает version.json (сотня байт), сравнивает
# версию и качает страницу только если она новее.
#
# APK подписывается постоянным ключом apk/keys/koma.jks, поэтому новые сборки
# ставятся ПОВЕРХ старых, без удаления (и без потери книг, моделей и настроек).

on:
  workflow_dispatch:
  push:
    paths:
      - 'apk/**'
      - '.github/workflows/apk.yml'
      - 'part*.js'
      - 'part1.html'

# Токену нужны права на запись в релизы — иначе «Resource not accessible by integration»
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Читалка — один html, собранный из частей. В git не лежит: собираем здесь,
      # чтобы в APK попала ровно та сборка, что соответствует исходникам.
      - name: Собрать читалку из частей
        run: |
          cat part1.html part0-ort.js part0-wasm.js part0-dict.js part2.js part3.js part4.js part5.js > koma-web.html
          VER=$(grep -o "VERSION = 'v[0-9.]*'" koma-web.html | head -1 | grep -o "v[0-9.]*")
          echo "версия читалки: $VER" | tee -a "$GITHUB_STEP_SUMMARY"
          SZ=$(stat -c%s koma-web.html)
          echo "размер: $SZ Б" | tee -a "$GITHUB_STEP_SUMMARY"
          # Заглушка вместо сборки = пустое приложение. Лучше упасть здесь.
          test "$SZ" -gt 5000000
          mkdir -p apk/app/src/main/assets
          cp koma-web.html apk/app/src/main/assets/koma-web.html
          # version.json — по нему приложение узнаёт о новой версии, не качая 11 МБ.
          APP=$(grep -o 'versionName = "[0-9.]*"' apk/app/build.gradle.kts | head -1 | grep -o '[0-9.]*')
          printf '{"page":"%s","app":"%s","built":"%s"}\n' "$VER" "$APP" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > version.json
          cat version.json

      - name: Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Собрать APK
        working-directory: apk
        run: gradle --no-daemon assembleDebug

      - name: Подпись и итог
        run: |
          APK=$(find apk -name '*.apk' | head -1)
          cp "$APK" koma-reader-debug.apk
          ls -l koma-reader-debug.apk >> "$GITHUB_STEP_SUMMARY"
          md5sum koma-reader-debug.apk >> "$GITHUB_STEP_SUMMARY"
          # Модели ДОЛЖНЫ быть внутри: без них на свежей установке распознавание
          # просит выбрать файлы руками — это уже случалось.
          unzip -l koma-reader-debug.apk | grep -E 'assets/models/' | tee -a "$GITHUB_STEP_SUMMARY"
          for f in det.onnx rec.onnx charset.txt; do
            unzip -l koma-reader-debug.apk | grep -q "assets/models/$f" || { echo "НЕТ встроенной модели $f"; exit 1; }
          done
          SZ=$(stat -c%s koma-reader-debug.apk)
          echo "размер APK: $SZ Б" | tee -a "$GITHUB_STEP_SUMMARY"
          # Потолок 50 МБ: за ним часть телефонов отказывается ставить APK.
          test "$SZ" -lt 52428800 || { echo "APK больше 50 МБ"; exit 1; }
          # Отпечаток ключа виден в логе: по нему проверяем, что ключ НЕ сменился
          # (сменился — обновление поверх не встанет). APK подписан по схеме v2,
          # поэтому смотрим apksigner, а не keytool (тот ищет v1-подпись в META-INF).
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs koma-reader-debug.apk | grep -i "SHA-256" | head -2
          else
            echo "apksigner не найден — отпечаток не проверен"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: koma-apk-debug
          path: koma-reader-debug.apk
          if-no-files-found: error

      # ── Один релиз на всё ─────────────────────────────────────────────────
      # Тег не меняется: `page`. Тело релиза тоже. Меняются только файлы.
      - name: Выложить в единственный релиз «page»
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view page --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create page --repo "$GITHUB_REPOSITORY" \
              --title "KOMA — обновления" \
              --notes "Один релиз на все обновления: здесь всегда лежат последняя читалка (koma-web.html), её версия (version.json) и APK. Приложение само проверяет version.json и скачивает новую страницу; APK ставится поверх старого, без удаления." \
              || true
          gh release upload page version.json koma-web.html koma-reader-debug.apk \
            --clobber --repo "$GITHUB_REPOSITORY"
          gh release view page --repo "$GITHUB_REPOSITORY" --json tagName,assets \
            | tee -a "$GITHUB_STEP_SUMMARY"
